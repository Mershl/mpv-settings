# Player #
loop-file=inf
border=no
osd-status-msg=${playback-time/full} / ${duration} (${percent-pos}%)\nframe: ${estimated-frame-number} / ${estimated-frame-count}
panscan=0
autofit-larger=90%x90%
force-window=immediate
sub-auto=all
sub-file-paths=sub:subtitles:Subs

# hwdec=auto
profile=fast

[protocol.file]
network-timeout=0
force-window=yes
cache=yes

[protocol-network]
network-timeout=5
loop-file=no
hls-bitrate=max
cache=yes

[protocol.http]
profile=protocol-network

[protocol.https]
profile=protocol-network

[audio-only]
profile-cond=not vid and vo_configured or p["current-tracks/video/albumart"]
autofit=25%x25%
script-opts-add=osc-visibility=always
save-position-on-quit=no
loop-playlist=inf
loop-file=no
